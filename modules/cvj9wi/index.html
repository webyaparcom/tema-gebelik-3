<script>
  (() => {
    const P = "modulex-galeri-surgu-gezgin";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const surgu = (s, P) => {
        const r = s.querySelector("input[data-sg]");
        const K = [...s.querySelectorAll("[data-sg-kare]")];
        if (!r || K.length < 2) return;
        s.classList.add(P + "--sjs");
        r.hidden = false;
        const E = [...s.querySelectorAll("[data-sg-etiket]")];
        const yaz = () => {
          const v = Math.max(0, Math.min(K.length - 1, Math.round(Number(r.value) || 0)));
          K.forEach((k, j) => { k.classList.toggle(P + "--aktif", j === v); k.setAttribute("aria-hidden", String(j !== v)); });
          E.forEach((e, j) => e.setAttribute("aria-pressed", String(j === v)));
          r.setAttribute("aria-valuetext", `${v + 1} / ${K.length} · ${K[v].dataset.sgAd || ""}`);
        };
        r.addEventListener("input", yaz);
        E.forEach((e, j) => e.addEventListener("click", () => { r.value = String(j); yaz(); }));
        yaz();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      surgu(s, P, az);
    });
  })();
</script>
