<style>
  /* iletisim-yorumlu-form — Ailede sosyal kanıtı (müşteri sözü) formla yan yana koyan tek modül: alıntı ayrı bir data satırından (ikon format_quote) seçilip kanal listesinden ayrılır; alanlar etiket-içeride kutu (:focus-within ile kutu + etiket rengi) — iletisim-bolunmus-form'un dış etiketli alanlarından ve testimonial ailesinden farklı olarak alıntı form kararını destekler. */

  .modulex-iletisim-yorumlu-form-yo-kutu:focus-within { border-color: --accent--; box-shadow: 0 12px 26px -20px color-mix(in srgb, --accent-- 90%, transparent); }
  .modulex-iletisim-yorumlu-form-yo-et { color: --muted--; font-size: 0.78rem; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; transition: color 0.2s ease; }
  .modulex-iletisim-yorumlu-form-yo-kutu:focus-within .modulex-iletisim-yorumlu-form-yo-et { color: --accentInk--; }
  .modulex-iletisim-yorumlu-form-yo-gir { inline-size: 100%; min-height: 32px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; }
  .modulex-iletisim-yorumlu-form-yo-gir:focus { outline: none; }
  textarea.modulex-iletisim-yorumlu-form-yo-gir { min-height: 110px; resize: vertical; }
  .modulex-iletisim-yorumlu-form-yo-gir option { background: --bg--; color: --text--; }
  .modulex-iletisim-yorumlu-form-yo-onay { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; }

  }
  .modulex-iletisim-yorumlu-form-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-yorumlu-form-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-yorumlu-form-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-yorumlu-form-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-yorumlu-form-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-yorumlu-form-eylem:hover { gap: 10px; }
  .modulex-iletisim-yorumlu-form-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-yorumlu-form-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-yorumlu-form--kjs .modulex-iletisim-yorumlu-form-kopya { display: inline-flex; }
  .modulex-iletisim-yorumlu-form-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-yorumlu-form-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-yorumlu-form--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-yorumlu-form-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-yorumlu-form-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-yorumlu-form-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-yorumlu-form-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-yorumlu-form-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-yorumlu-form-cikon { font-size: 18px; }
  .modulex-iletisim-yorumlu-form-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-yorumlu-form-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-yorumlu-form-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-yorumlu-form-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-yorumlu-form-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-yorumlu-form-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-yorumlu-form-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-yorumlu-form-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-yorumlu-form-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  .modulex-iletisim-yorumlu-form-form { display: grid; gap: 18px; }
  .modulex-iletisim-yorumlu-form-fbaslik { font-size: 1.3rem; font-weight: 750; }
  .modulex-iletisim-yorumlu-form-alanlar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .modulex-iletisim-yorumlu-form-alan { display: flex; flex-direction: column-reverse; gap: 6px; }
  .modulex-iletisim-yorumlu-form-alan--genis { grid-column: 1 / -1; }
  .modulex-iletisim-yorumlu-form-etiket { font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-yorumlu-form-girdi { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid color-mix(in srgb, currentColor 26%, transparent); border-radius: 12px; background: color-mix(in srgb, currentColor 4%, transparent); color: inherit; font: inherit; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  textarea.modulex-iletisim-yorumlu-form-girdi { min-height: 132px; resize: vertical; }
  .modulex-iletisim-yorumlu-form-girdi:focus { outline: none; border-color: --accent--; box-shadow: 0 0 0 3px color-mix(in srgb, --accent-- 28%, transparent); }

  .modulex-iletisim-yorumlu-form-secim option { background: --bg--; color: --text--; }
  .modulex-iletisim-yorumlu-form-onay { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; }

  .modulex-iletisim-yorumlu-form-onay a { color: inherit; font-weight: 700; text-underline-offset: 3px; }

  .modulex-iletisim-yorumlu-form-durum { min-height: 1.5em; font-size: 0.95rem; font-weight: 650; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-yorumlu-form :is(.modulex-iletisim-yorumlu-form-baslik, .modulex-iletisim-yorumlu-form-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-yorumlu-form-baslik { line-height: 1.35; }

    .modulex-iletisim-yorumlu-form { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-yorumlu-form *, .modulex-iletisim-yorumlu-form *::before, .modulex-iletisim-yorumlu-form *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-yorumlu-form";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const form = (s, P) => {
        s.querySelectorAll("form[data-fb-form]").forEach((f) => {
          const durum = f.querySelector("[role=status]");
          const yaz = (m, hata) => { if (durum) { durum.textContent = m || ""; durum.classList.toggle(P + "-durum--hata", !!hata); } };
          let t0 = Date.now();
          const al = (ad) => { const e = f.elements.namedItem(ad); return e && "value" in e ? String(e.value).trim() : ""; };
          const etiket = (ad) => { const e = f.elements.namedItem(ad); const l = e && e.id ? f.querySelector(`label[for="${e.id}"]`) : null; return l ? l.textContent.trim() : ad; };
          const konuMetin = () => { const e = f.elements.namedItem("topic"); return e && e.selectedIndex > 0 ? e.options[e.selectedIndex].text.trim() : ""; };
          f.addEventListener("submit", (e) => {
            e.preventDefault();
            if (!f.checkValidity()) { f.reportValidity(); return; }
            if (al("website")) return;
            const govde = ["name", "email", "phone"].filter(al).map((k) => `${etiket(k)}: ${al(k)}`)
              .concat(konuMetin() ? [`${etiket("topic")}: ${konuMetin()}`] : [], al("message") ? ["", al("message")] : []).join("\n");
            const d = f.dataset;
            if (d.action) {
              const b = f.querySelector("[type=submit]");
              if (b) b.disabled = true;
              const yuk = { name: al("name"), email: al("email"), phone: al("phone"), topic: konuMetin(), message: al("message"), kvkk: true, lang: document.documentElement.lang || "", page: location.pathname, website: al("website"), t: Date.now() - t0 };
              fetch(d.action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(yuk) })
                .then((r) => r.json().catch(() => ({})).then((j) => r.ok && j && j.ok !== false))
                .then((ok) => { if (b) b.disabled = false; yaz(ok ? d.ok : d.hata, !ok); if (ok) { f.reset(); t0 = Date.now(); } })
                .catch(() => { if (b) b.disabled = false; yaz(d.hata, true); });
              return;
            }
            if (d.gonderim === "whatsapp" && d.wa) { window.open(`https://wa.me/${d.wa}?text=${encodeURIComponent(govde)}`, "_blank", "noopener"); return; }
            if (d.eposta) {
              const konu = [d.konu || "", konuMetin()].filter(Boolean).join(" - ");
              location.href = `mailto:${d.eposta}?subject=${encodeURIComponent(konu)}&body=${encodeURIComponent(govde.replace(/\n/g, "\r\n"))}`;
            }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      form(s, P, az);
    });
  })();
</script>
